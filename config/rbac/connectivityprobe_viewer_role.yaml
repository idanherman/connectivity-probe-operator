# This rule is not used by the project connectivity-probe-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to monitoring.connectivity-probe.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: connectivity-probe-operator
    app.kubernetes.io/managed-by: kustomize
  name: connectivityprobe-viewer-role
rules:
- apiGroups:
  - monitoring.connectivity-probe.io
  resources:
  - connectivityprobes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - monitoring.connectivity-probe.io
  resources:
  - connectivityprobes/status
  verbs:
  - get
