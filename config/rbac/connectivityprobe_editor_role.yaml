# This rule is not used by the project connectivity-probe-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the monitoring.connectivity-probe.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: connectivity-probe-operator
    app.kubernetes.io/managed-by: kustomize
  name: connectivityprobe-editor-role
rules:
- apiGroups:
  - monitoring.connectivity-probe.io
  resources:
  - connectivityprobes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - monitoring.connectivity-probe.io
  resources:
  - connectivityprobes/status
  verbs:
  - get
