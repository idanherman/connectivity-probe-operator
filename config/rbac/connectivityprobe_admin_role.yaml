# This rule is not used by the project connectivity-probe-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over monitoring.connectivity-probe.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: connectivity-probe-operator
    app.kubernetes.io/managed-by: kustomize
  name: connectivityprobe-admin-role
rules:
- apiGroups:
  - monitoring.connectivity-probe.io
  resources:
  - connectivityprobes
  verbs:
  - '*'
- apiGroups:
  - monitoring.connectivity-probe.io
  resources:
  - connectivityprobes/status
  verbs:
  - get
