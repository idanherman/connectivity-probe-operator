---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: connectivityprobes.monitoring.connectivity-probe.io
spec:
  group: monitoring.connectivity-probe.io
  names:
    kind: ConnectivityProbe
    listKind: ConnectivityProbeList
    plural: connectivityprobes
    shortNames:
    - cprobe
    singular: connectivityprobe
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.meshSize
      name: Mesh Size
      type: integer
    - jsonPath: .status.edgesUp
      name: Edges Up
      type: integer
    - jsonPath: .status.edgesDown
      name: Edges Down
      type: integer
    - jsonPath: .status.meshHealthPercent
      name: Health %
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ConnectivityProbe is the Schema for the connectivityprobes API.
          It declares a full-mesh connectivity monitoring deployment across cluster nodes.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ConnectivityProbeSpec defines the desired state of a connectivity
              probe mesh.
            properties:
              alerting:
                description: Alerting configures PrometheusRule thresholds.
                properties:
                  consecutiveFailures:
                    default: 3
                    description: ConsecutiveFailures before firing a connectivity
                      alert.
                    format: int32
                    minimum: 1
                    type: integer
                  enabled:
                    default: false
                    description: Enabled toggles PrometheusRule generation.
                    type: boolean
                  latencyCriticalThreshold:
                    description: LatencyCriticalThreshold fires a critical alert when
                      p99 exceeds this (e.g. "200ms").
                    type: string
                  latencyWarningThreshold:
                    description: LatencyWarningThreshold fires a warning when p99
                      exceeds this (e.g. "50ms").
                    type: string
                  meshHealthPercentThreshold:
                    default: 100
                    description: MeshHealthPercentThreshold fires when mesh health
                      drops below this value.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                required:
                - enabled
                type: object
              bandwidthTests:
                description: BandwidthTests configures optional scheduled iPerf3 bandwidth
                  tests.
                properties:
                  concurrency:
                    default: 1
                    description: Concurrency is the number of node-pairs tested simultaneously.
                    format: int32
                    minimum: 1
                    type: integer
                  enabled:
                    default: false
                    description: Enabled toggles bandwidth testing on or off.
                    type: boolean
                  maxBandwidth:
                    default: 100M
                    description: MaxBandwidth caps each iPerf3 test (e.g. "100M").
                    type: string
                  schedule:
                    default: 0 */4 * * *
                    description: Schedule is a cron expression (e.g. "0 */4 * * *").
                    type: string
                  testDuration:
                    default: 10s
                    description: TestDuration per node-pair.
                    type: string
                  udpTest:
                    default: false
                    description: UDPTest enables an additional UDP jitter/loss test
                      per pair.
                    type: boolean
                required:
                - enabled
                type: object
              continuousProbes:
                description: ContinuousProbes configures the always-on lightweight
                  probing mesh.
                properties:
                  interval:
                    default: 200ms
                    description: Interval between probes. Must be >= 50ms.
                    pattern: ^[0-9]+(ms|s)$
                    type: string
                  peerResolveInterval:
                    default: 10s
                    description: |-
                      PeerResolveInterval controls how often the agent re-resolves the
                      headless Service DNS to discover new/removed peers.
                    pattern: ^[0-9]+(ms|s|m)$
                    type: string
                  protocols:
                    default:
                    - tcp
                    description: Protocols to probe. At least one required.
                    items:
                      description: ProbeProtocol is a supported probe type.
                      enum:
                      - tcp
                      - http
                      - websocket
                      type: string
                    minItems: 1
                    type: array
                  reconnectDelay:
                    default: 1s
                    description: ReconnectDelay before retrying a failed peer connection.
                    pattern: ^[0-9]+(ms|s)$
                    type: string
                type: object
              externalSentinel:
                description: |-
                  ExternalSentinel configures HostPort exposure for out-of-cluster scrapers
                  that must keep monitoring even when the API server is unavailable.
                properties:
                  enabled:
                    default: false
                    description: Enabled toggles HostPort exposure.
                    type: boolean
                  healthHostPort:
                    default: 9201
                    description: HealthHostPort is the host port for the health/status
                      endpoint.
                    format: int32
                    maximum: 65535
                    minimum: 1024
                    type: integer
                  metricsHostPort:
                    default: 9200
                    description: MetricsHostPort is the host port for the Prometheus
                      metrics endpoint.
                    format: int32
                    maximum: 65535
                    minimum: 1024
                    type: integer
                required:
                - enabled
                type: object
              image:
                description: Image is the container image for the mesh agent DaemonSet.
                minLength: 1
                type: string
              metrics:
                description: Metrics configures Prometheus metrics exposure and ServiceMonitor.
                properties:
                  enabled:
                    default: true
                    description: Enabled toggles Prometheus metrics exposition on
                      the agent.
                    type: boolean
                  latencyBuckets:
                    default:
                    - 0.0005
                    - 0.001
                    - 0.005
                    - 0.01
                    - 0.025
                    - 0.05
                    - 0.1
                    - 0.25
                    - 0.5
                    - 1
                    description: LatencyBuckets for the probe-latency histogram (seconds).
                    items:
                      type: string
                    type: array
                  scrapeInterval:
                    default: 15s
                    description: ScrapeInterval for the auto-managed ServiceMonitor.
                    type: string
                type: object
              nodeSelector:
                additionalProperties:
                  type: string
                description: |-
                  NodeSelector restricts which nodes run the mesh agent.
                  An empty selector (the default) schedules on every node.
                type: object
              priorityClassName:
                description: PriorityClassName for the mesh agent pods.
                type: string
              resources:
                description: Resources for the mesh agent container.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This is an alpha field and requires enabling the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              tolerations:
                description: |-
                  Tolerations allow the mesh agent to schedule on tainted nodes
                  (e.g. control-plane, infra).
                items:
                  description: |-
                    The pod this Toleration is attached to tolerates any taint that matches
                    the triple <key,value,effect> using the matching operator <operator>.
                  properties:
                    effect:
                      description: |-
                        Effect indicates the taint effect to match. Empty means match all taint effects.
                        When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                      type: string
                    key:
                      description: |-
                        Key is the taint key that the toleration applies to. Empty means match all taint keys.
                        If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                      type: string
                    operator:
                      description: |-
                        Operator represents a key's relationship to the value.
                        Valid operators are Exists and Equal. Defaults to Equal.
                        Exists is equivalent to wildcard for value, so that a pod can
                        tolerate all taints of a particular category.
                      type: string
                    tolerationSeconds:
                      description: |-
                        TolerationSeconds represents the period of time the toleration (which must be
                        of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                        it is not set, which means tolerate the taint forever (do not evict). Zero and
                        negative values will be treated as 0 (evict immediately) by the system.
                      format: int64
                      type: integer
                    value:
                      description: |-
                        Value is the taint value the toleration matches to.
                        If the operator is Exists, the value should be empty, otherwise just a regular string.
                      type: string
                  type: object
                type: array
            required:
            - image
            type: object
          status:
            description: ConnectivityProbeStatus defines the observed state of the
              mesh.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the resource's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              daemonSetName:
                description: DaemonSetName is the name of the managed DaemonSet.
                type: string
              edgesDown:
                description: EdgesDown is the number of edges currently failing.
                format: int32
                type: integer
              edgesTotal:
                description: EdgesTotal is the total number of edges (node-pairs)
                  in the mesh.
                format: int32
                type: integer
              edgesUp:
                description: EdgesUp is the number of edges currently healthy.
                format: int32
                type: integer
              lastReconcileTime:
                description: LastReconcileTime is the timestamp of the last successful
                  reconciliation.
                format: date-time
                type: string
              meshHealthPercent:
                description: MeshHealthPercent is EdgesUp / EdgesTotal * 100.
                format: int32
                maximum: 100
                minimum: 0
                type: integer
              meshSize:
                description: MeshSize is the number of nodes participating in the
                  mesh.
                format: int32
                type: integer
              sentinelEndpoints:
                description: |-
                  SentinelEndpoints lists node-ip:port pairs available for external scraping.
                  Populated only when spec.externalSentinel.enabled is true.
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
