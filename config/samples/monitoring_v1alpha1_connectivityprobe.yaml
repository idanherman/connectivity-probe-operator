apiVersion: monitoring.connectivity-probe.io/v1alpha1
kind: ConnectivityProbe
metadata:
  labels:
    app.kubernetes.io/name: connectivity-probe-operator
    app.kubernetes.io/managed-by: kustomize
  name: connectivity-mesh
spec:
  image: quay.io/idanherman/connectivity-probe-agent:latest

  continuousProbes:
    interval: "200ms"
    protocols:
      - tcp
      - http
    reconnectDelay: "1s"
    peerResolveInterval: "10s"

  bandwidthTests:
    enabled: false
    schedule: "0 */4 * * *"
    maxBandwidth: "100M"
    concurrency: 1
    testDuration: "10s"
    udpTest: true

  externalSentinel:
    enabled: true
    metricsHostPort: 9200
    healthHostPort: 9201

  tolerations:
    - operator: Exists

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

  metrics:
    enabled: true
    scrapeInterval: "15s"

  alerting:
    enabled: true
    consecutiveFailures: 3
    latencyWarningThreshold: "50ms"
    latencyCriticalThreshold: "200ms"
    meshHealthPercentThreshold: 100
